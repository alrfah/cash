async function login(){
 const email=$("#u").value.trim().toLowerCase(),pw=$("#pw").value,m=$("#m");
 if(!/^\S+@\S+\.\S+$/.test(email)){m.textContent="أدخل بريدًا إلكترونيًا صحيحًا";return}
 if(pw.length<6){m.textContent="كلمة المرور يجب أن تكون 6 أحرف على الأقل";return}
 const submit=$("#go");
 if(submit){submit.disabled=true;submit.textContent="جارٍ التحقق…"}
 try{
  const cred=await auth.signInWithEmailAndPassword(email,pw);
  const ix=await db.doc("uidIndex/"+cred.user.uid).get();
  let accountId=ix.exists?ix.data().accountId:null;
  if(!accountId){
   let legacyId=null;try{legacyId=localStorage.getItem("rc_id")}catch(e){}
   if(legacyId){
    const legacy=await db.doc("accounts/"+legacyId).get();

     accountId=legacyId;const ld=legacy.data();
     await db.doc("uidIndex/"+cred.user.uid).set({accountId,username:ld.username,email:ld.email});
     await db.doc("usernameIndex/"+ld.username).set({email:ld.email,uid:cred.user.uid,accountId});
    }
   }
  }
  if(!accountId){await auth.signOut();m.textContent="بيانات الحساب غير مكتملة؛ أنشئ الحساب من جديد أو تواصل مع الدعم";return}
  const snap=await db.doc("accounts/"+accountId).get();
  if(!snap.exists || snap.data().uid!==cred.user.uid){await auth.signOut();m.textContent="بيانات الحساب غير مكتملة؛ تواصل مع الدعم";return}

  if(data.banned){await auth.signOut();m.textContent="هذا الحساب محظور";return}
  if(data.frozen){await auth.signOut();m.textContent="هذا الحساب مجمّد مؤقتًا؛ تواصل مع الدعم";return}
  start(accountId,data);
 }catch(e){
  const code=String(e&&e.code||"");
  if(code.includes("invalid-credential")||code.includes("wrong-password")||code.includes("user-not-found")){m.textContent="البريد الإلكتروني أو كلمة المرور غير صحيحة"}
  else if(code.includes("operation-not-allowed")){m.textContent="فعّل Email/Password من Firebase Authentication"}
  else if(code.includes("network-request-failed")){m.textContent="تعذر الاتصال بـ Firebase؛ تحقق من الإنترنت"}
  else if(code.includes("quota-exceeded")){m.textContent="تم تجاوز حد Firebase المؤقت. انتظر قليلًا ثم أعد المحاولة، أو راجع Usage وQuotas"}
  else if(code.includes("permission-denied")){m.textContent="قواعد Realtime Database تمنع قراءة الحساب؛ انشر ملف Rules الجديد"}
  else{m.textContent="تعذّر تسجيل الدخول ("+(code||"تحقق من إعدادات Firebase")+")"}
  if(submit){submit.disabled=false;submit.textContent="دخول"}
 }
}
async function register(){

 }
}

 const to=$("#to").value.trim().toUpperCase(),am=parseFloat($("#am").value),m=$("#sm");

 if(to===me.id){m.textContent="لا يمكن التحويل لحسابك";return}

  if(Number(sender[sc]||0)<am){m.textContent="الرصيد غير كافٍ";return}
  const ts=Date.now(),txRef=ref("tx").push(),noticeRef=ref("userNotifications/"+to).push();
  const t={from:me.id,to,fromName:sender.fullname||sender.username||me.id,toName:recipient.fullname||recipient.username||to,amount:am,cur:sc,type:"transfer",label:"حوالة",ts,id:txRef.key};
  const updates={};
  updates["accounts/"+me.id+"/"+sc]=Number(sender[sc]||0)-am;

}

function splash(){$("#app").innerHTML=`<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px"><img id="lg" width="120" height="120" style="animation:pg .6s both"><h1 style="color:var(--pri)">الرفاه كاش</h1></div>`;mkLogo(240).then(u=>{const e=$("#lg");if(e)e.src=u})}
async function drawReceipt(t){
 try{await document.fonts.load("700 30px Cairo");await document.fonts.load("400 24px Cairo");await LOGO_IMG.decode()}catch(e){}
 const c=document.createElement("canvas");c.width=800;c.height=1130;const x=c.getContext("2d");
 const rr=(X,Y,W,H,R,f)=>{x.beginPath();x.moveTo(X+R,Y);x.arcTo(X+W,Y,X+W,Y+H,R);x.arcTo(X+W,Y+H,X,Y+H,R);x.arcTo(X,Y+H,X,Y,R);x.arcTo(X,Y,X+W,Y,R);x.closePath();x.fillStyle=f;x.fill()};
 const T=(s,px,y,f,col,al,dir)=>{x.font=f+" Cairo,sans-serif";x.fillStyle=col;x.textAlign=al||"right";x.direction=dir||"rtl";x.textBaseline="alphabetic";x.fillText(s,px,y)};
 x.fillStyle="#f5f3ff";x.fillRect(0,0,800,1130);
 const g=x.createLinearGradient(0,0,800,260);g.addColorStop(0,"#2a1a80");g.addColorStop(1,"#6a43f0");x.fillStyle=g;x.fillRect(0,0,800,270);
 x.fillStyle="#ffffff12";x.beginPath();x.arc(120,20,170,0,7);x.fill();x.beginPath();x.arc(720,260,130,0,7);x.fill();
 x.save();x.shadowColor="#0006";x.shadowBlur=24;x.shadowOffsetY=8;rr(52,52,128,128,34,"#fff");x.restore();x.drawImage(LOGO_IMG,60,60,112,112);
 T("الرفاه كاش",750,112,"700 46px","#fff");T("إيصال تحويل أموال",750,162,"400 26px","#ffffffd9");
 x.save();x.shadowColor="#4b2fc033";x.shadowBlur=36;x.shadowOffsetY=12;rr(50,215,700,230,34,"#fff");x.restore();
 T("المبلغ المرسل",400,278,"400 26px","#7a7f96","center");T(fmt(t.amount)+" "+CN[t.cur],400,358,"700 64px","#4b2fc0","center");
 rr(290,386,220,42,21,"#e3f6ee");T("✓ عملية ناجحة",400,416,"700 22px","#1f8a63","center");
 let d;try{d=new Date(t.ts).toLocaleString("ar-u-nu-latn",{dateStyle:"medium",timeStyle:"medium"})}catch(e){d=new Date(t.ts).toLocaleString()}
 const rows=[['↗','المرسل',t.fromName,t.from],['↙','المستلم',t.toName,t.to],['#','رقم العملية','RC'+t.ts.toString(36).toUpperCase(),''],['◷','التاريخ والوقت',d,'']];
 rr(50,480,700,rows.length*118+30,34,"#fff");
 let y=535;rows.forEach((r,k)=>{x.fillStyle="#f0edff";x.beginPath();x.arc(106,y+28,28,0,Math.PI*2);x.fill();T(r[0],106,y+37,"700 25px","#4b2fc0","center");T(r[1],715,y,"700 21px","#7a7f96");T(r[2]||"",715,y+44,"700 31px","#1b2030","right",r[3]?"ltr":"rtl");if(r[3])T(r[3],715,y+76,"400 19px","#8a90a6","right","ltr");if(k<rows.length-1){x.fillStyle="#eceaf8";x.fillRect(85,y+94,630,2)}y+=118});
 x.save();x.globalAlpha=.07;x.drawImage(LOGO_IMG,150,330,500,500);x.restore();
 x.fillStyle="#d9d4f5";x.fillRect(50,1040,700,2);x.drawImage(LOGO_IMG,360,1056,48,48);
 T("الرفاه كاش — محفظتك الرقمية",400,1122,"400 20px","#8a90a6","center");
 return c}
function rcFor(i){const t=LST[i];if(!t)return;const nm=me.fullname||me.username,r={...t,fromName:t.fromName||(t.from===me.id?nm:t.from),toName:t.toName||(t.to===me.id?nm:t.to)};
 if(t.type==="service")r.toName=t.label;if(t.type==="topup"){r.fromName=t.label;r.from=t.ref||""}
 try{navigator.vibrate&&navigator.vibrate(18)}catch(e){}receiptSheet(r,true)}
(()=>{let tm,sx=0,sy=0;const st=()=>clearTimeout(tm);
 document.addEventListener("pointerdown",e=>{const r=e.target.closest&&e.target.closest(".tx[data-i],.tx[data-notice]");if(!r)return;sx=e.clientX;sy=e.clientY;r.classList.add("lp");tm=setTimeout(()=>{r.classList.remove("lp");if(r.dataset.notice)noticeReceipt(r.dataset.noticeId);else rcFor(+r.dataset.i)},520)});
 document.addEventListener("pointermove",e=>{if(Math.abs(e.clientX-sx)>10||Math.abs(e.clientY-sy)>10)st()});
 ["pointerup","pointercancel","scroll"].forEach(k=>document.addEventListener(k,()=>{st();document.querySelectorAll(".tx.lp").forEach(x=>x.classList.remove("lp"))},true));
 document.addEventListener("contextmenu",e=>{if(e.target.closest&&e.target.closest(".tx[data-i],.tx[data-notice]"))e.preventDefault()})})();
function fullSuccess(t){sheet(null);const o=document.createElement("div");o.id="ok";
 o.innerHTML=`<button class="circ" id="okx" style="position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:16px;z-index:2;background:#ffffff26;color:#fff">${I("x",22)}</button><div class="okc"><div class="okl"><i></i><i></i><img src="${LOGO_URL}"></div><div class="okt">${I("circle-check",26)} تمت العملية بنجاح</div><div class="oka" style="direction:ltr">${fmt(t.amount)} ${CS[t.cur]}</div><div class="okd">إلى <b>${esc(t.toName||t.to)}</b></div><div class="okd" style="opacity:.7;font-size:13px">${new Date(t.ts).toLocaleString("ar")}</div><div class="rbtns" style="grid-template-columns:1fr 1fr;width:100%;margin-top:26px"><button onclick="rcOut('save')">${I("file-down",22)}حفظ PDF</button><button onclick="rcOut('share')">${I("share-2",22)}مشاركة</button></div><div class="lab" id="rl2" style="color:#fff;margin-top:10px"></div></div>`;
 document.body.appendChild(o);ico();$("#okx").onclick=()=>{o.remove();render()};
 drawReceipt(t).then(c=>{rcpt={c,t}})}
async function receiptSheet(t,hist){if(!hist){fullSuccess(t);return}const HT=hist?"إيصال العملية":"تمت العملية بنجاح";
 sheet(`<h2 style="text-align:center">${I("circle-check",26)} ${HT}</h2><div class="lab">جارٍ تجهيز الإيصال…</div>`);
 const c=await drawReceipt(t);rcpt={c,t};
 sheet(`<h2 style="text-align:center;color:var(--ok)">${I("circle-check",26)} ${HT}</h2><img class="receipt-preview" src="${c.toDataURL("image/jpeg",.9)}" style="width:100%;max-height:46vh;object-fit:contain;border-radius:14px;margin-bottom:12px;background:#fff"><div class="rbtns receipt-actions" style="grid-template-columns:1fr 1fr"><button onclick="rcOut('save')">${I("file-down",22)}حفظ PDF</button><button onclick="rcOut('share')">${I("share-2",22)}مشاركة PDF</button></div><div class="lab" id="rl2" style="margin-top:8px"></div>`)}
async function rcOut(mode){
 if(!rcpt){return}const {c,t}=rcpt,n="alrafah-receipt-"+t.ts+".pdf",L=$("#rl2");let b;
 try{const d=new window.jspdf.jsPDF({unit:"px",format:[800,1130],orientation:"portrait"});d.addImage(c.toDataURL("image/jpeg",.92),"JPEG",0,0,800,1130);b=d.output("blob")}catch(e){L.textContent="تعذّر إنشاء PDF";return}
 const f=new File([b],n,{type:"application/pdf"}),sh=async()=>{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return true}return false},sv=async()=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=n;a.click();URL.revokeObjectURL(a.href);return true};
 try{const ok=mode==="share"?(await sh()||await sv()):(await sv()||await sh());if(!ok)L.textContent="الحفظ غير متاح هنا"}catch(e){if(e&&e.name!=="AbortError")L.textContent="تعذّر الحفظ"}
}
function svcSheet(i){const s=SERVICES[i];sheet(`<h2>${I(s[0],22)} ${s[1]}</h2><input id="rf" placeholder="${s[2]}" style="direction:ltr;text-align:right"><input id="am" type="number" inputmode="decimal" placeholder="المبلغ (${CS[cur]})"><div class="msg" id="sm"></div><button class="btn" id="sb">دفع</button>`);$("#sb").onclick=()=>pay(i)}
async function pay(i){
 const rf=$("#rf").value.trim(),am=parseFloat($("#am").value),m=$("#sm");
 if(!rf){m.textContent="أدخل "+SERVICES[i][2];return}
 if(!(am>0)||am>(me[cur]||0)){m.textContent="المبلغ غير صالح أو الرصيد غير كافٍ";return}
 const btn=$("#sb");if(!btn||btn.disabled)return;btn.disabled=true;btn.textContent="جارٍ التنفيذ…";
 try{
  await db.doc("accounts/"+me.id).update({[cur]:(me[cur]||0)-am});
  await db.collection("tx").add({from:me.id,to:rf,amount:am,cur,type:"service",label:SERVICES[i][1],ts:Date.now()});
  sheet(null);
 }catch(e){m.textContent=e&&e.code==="permission-denied"?"لا يمكنك تنفيذ العملية لأن رصيدك معلّق. تواصل مع الإدارة":"تعذر تنفيذ الدفع؛ حاول مرة أخرى"}finally{if(btn&&btn.isConnected){btn.disabled=false;btn.textContent="دفع"}}
}
(async()=>{authView();auth.onAuthStateChanged(async user=>{if(!user)return;let id=null;try{id=localStorage.getItem("rc_id")}catch(e){}if(id){const s=await db.doc("accounts/"+id).get();if(s.exists()&&s.data().uid===user.uid)start(id,s.data());}})})();
</script>
